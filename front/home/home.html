<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.1.0/uicons-bold-rounded/css/uicons-bold-rounded.css'>
    <link rel="stylesheet" href="home.css">
    <title>EduGrade - Painel</title>
</head>

<body>

    <div class="card">

        <img src="/front/assets/userEduGrade.png" class="user-icon" onclick="abrirModal()">

        <header>
            <div class="logo">
                <h1>Edu<span>Grade</span></h1>
            </div>
            <p>Bem-vindo ao Painel de Controle</p>
        </header>
        <nav class="menu">
            <a href="../nota/nota.html" class="menu-btn">
                <i class="fi fi-br-book-alt icon"></i>
                <span class="text">NOTAS</span>
            </a>

            <a href="../aluno/aluno.html" class="menu-btn">
                <i class="fi fi-br-users icon"></i>
                <span class="text">ALUNOS</span>
            </a>

            <a href="../professor/professor.html" class="menu-btn">
                <i class="fi fi-br-graduation-cap icon"></i>
                <span class="text">PROFESSORES</span>
            </a>

            <a href="../disciplina/disciplina.html" class="menu-btn">
                <i class="fi fi-br-books icon"></i>
                <span class="text">DISCIPLINAS</span>
            </a>
        </nav>
    </div>

    <div id="modalUser" class="modal">
        <div class="modal-content">
            <span class="fechar" onclick="fecharModal()">x</span>

            <h2>Meu Perfil</h2>

            <p><strong>Nome:</strong> <span id="nomeUser"></span></p>
            <p><strong>Tipo:</strong> <span id="tipoUser"></span></p>

            <button onclick="logout()" class="btn-logout">Sair</button>
        </div>
    </div>

    <script>

        const API = window.location.hostname === "localhost"
            ? "http://127.0.0.1:3000"
            : "https://projetointegradorapi-back.onrender.com";

        function abrirModal() {
            const modal = document.getElementById("modalUser");
            modal.style.display = "flex";

            const nome = localStorage.getItem("nomeUsuario");
            console.log("NOME:", nome); // 👈 TEM QUE APARECER

            document.getElementById("nomeUser").innerText = nome;
            document.getElementById("tipoUser").innerText = "Administrador";
        }

        function fecharModal() {
            document.getElementById("modalUser").style.display = "none";
        }

        // fechar clicando fora
        window.onclick = function (event) {
            const modal = document.getElementById("modalUser");
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = "../index.html";
        }

    </script>
</body>

</html>
