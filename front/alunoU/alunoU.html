<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>EduGrade - Aproveitamento</title>
    <link rel="stylesheet" href="alunoU.css">
</head>

<body>

    <div class="topo">
        <div class="logo-container">
            <h2>Edu<span>Grade</span></h2>
            <img src="/front/assets/userEduGrade.png" class="user-icon" onclick="abrirModal()">
        </div>

        <strong>Aproveitamento</strong>

    </div>
    <!-- MODAL -->
    <div id="modalUser" class="modal">
        <div class="modal-content">
            <span class="fechar" onclick="fecharModal()">x</span>

            <h2>Meu Perfil</h2>

            <p><strong>Nome:</strong> <span id="nomeUser"></span></p>
            <p><strong>Tipo:</strong> <span id="tipoUser"></span></p>

            <button onclick="logout()" class="btn-logout">Sair</button>
        </div>
    </div>

    <div id="lista-materias"></div>

    <script src="alunoU.js"></script>
</body>

</html>
